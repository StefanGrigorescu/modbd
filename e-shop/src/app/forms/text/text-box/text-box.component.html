<mat-form-field>
    <mat-label *ngIf="fieldTitle">
        {{fieldTitle}}
    </mat-label>
    <textarea
        matInput
        [formControl]="control"
        (blur)="updateValidationMessage()"
        [name]="inputName"
        type="text"
        [autocomplete]="autocomplete"
    ></textarea>
    <mat-error *ngIf="validationMessage">
        {{ validationMessage ?? 'Invalid input!' }}
    </mat-error>
</mat-form-field>
