<mat-form-field [appearance]="appearance">
    <mat-label>
        {{fieldTitle}}
    </mat-label>
    <input
        matInput
        [formControl]="control"
        (blur)="updateValidationMessage()"
        name="password"
        type="password"
        [autocomplete]="autocomplete"
    />
    <mat-error *ngIf="validationMessage">
        {{ validationMessage ?? 'Invalid input!' }}
    </mat-error>
</mat-form-field>
